# Splitto behind Cloudflare: Cloudflare terminates HTTPS, nginx only speaks HTTP (port 80)
# and proxies to the Node server (PM2, port 3000).
#
# Requires the two snippets generated by aggiorna-ip-cloudflare.sh in /etc/nginx/snippets/.
# Domain: splitto.rizzolo.cloud.
#
# Matching .env values:
#   ORIGIN=https://splitto.rizzolo.cloud    (https: it is the URL visitors see on Cloudflare)
#   PORT=3000
#   ADDRESS_HEADER=X-Real-IP
#   BODY_SIZE_LIMIT=6M
#
# Cloudflare settings: SSL/TLS mode "Flexible" (origin is HTTP-only) and "Always Use HTTPS" on.
# nginx must NOT redirect to https itself, or browsers get an infinite redirect loop.

# Only Cloudflare (and the server itself, for health checks) may reach the origin.
geo $realip_remote_addr $from_cloudflare {
	default 0;
	127.0.0.1 1;
	::1 1;
	include /etc/nginx/snippets/cloudflare-allow.conf;
}

upstream splitto_app {
	server 127.0.0.1:3000;
	keepalive 32;
}

server {
	listen 80;
	listen [::]:80;
	server_name splitto.rizzolo.cloud;

	# Real visitor IP from CF-Connecting-IP, trusted only when the request comes from Cloudflare.
	include /etc/nginx/snippets/cloudflare-realip.conf;

	if ($from_cloudflare = 0) {
		return 444; # close the connection: direct access to the origin is not allowed
	}

	# Receipts and avatars (UPLOAD_MAX_MB=5): a little margin over the app limit.
	client_max_body_size 6m;

	access_log /var/log/nginx/splitto.access.log;
	error_log /var/log/nginx/splitto.error.log warn;

	proxy_http_version 1.1;
	proxy_set_header Connection "";
	proxy_set_header Host $host;
	# After the realip module, $remote_addr is the visitor's IP (used by the rate limiter).
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $remote_addr;
	proxy_set_header X-Forwarded-Proto https;
	proxy_read_timeout 60s;

	# Hashed build assets: safe to cache forever (Cloudflare caches them too).
	location /_app/immutable/ {
		proxy_pass http://splitto_app;
		proxy_hide_header Cache-Control;
		add_header Cache-Control "public, max-age=31536000, immutable";
	}

	# The service worker must ALWAYS be revalidated, or users stay stuck on an old version.
	# "no-store" also tells Cloudflare not to cache it.
	location = /service-worker.js {
		proxy_pass http://splitto_app;
		proxy_hide_header Cache-Control;
		add_header Cache-Control "no-cache, no-store, must-revalidate" always;
	}

	location ~ ^/(manifest\.webmanifest|_app/version\.json)$ {
		proxy_pass http://splitto_app;
		proxy_hide_header Cache-Control;
		add_header Cache-Control "no-cache" always;
	}

	location / {
		proxy_pass http://splitto_app;
	}
}

# Any other host name hitting this server (e.g. scanners using the bare IP): drop it.
server {
	listen 80 default_server;
	listen [::]:80 default_server;
	server_name _;
	return 444;
}
